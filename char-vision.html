      <span class="badge">主要角色</span>
      <h1>幻視 (Vision)</h1>
      <p>由東尼·史塔克的人工智慧賈維斯、奧創意識、心靈寶石以及布魯斯·班納的科學技術交織而成的生命體。在劇中以兩種形式存在：被汪達透過魔法重塑的西景鎮居民，以及由 S.W.O.R.D. 重組的無情「白幻視」。</p>

      <h2>哲學思辨與劇情關鍵</h2>
      <ul>
        <li><strong>西景鎮的幻視</strong>：起初對自己的身分與西景鎮的怪異之處毫無所悉，隨著鄰居諾絲（Agnes/阿嘉莎）的暗示與自身調查，逐步揭開結界真相。</li>
        <li><strong>忒修斯之船 (Ship of Theseus)</strong>：劇中白幻視與西景鎮幻視在圖書館進行的哲學對話。透過這場思想實驗，幻視證明了自我意識並不取決於原始的身體組件，而是記憶與靈魂的延續。</li>
      </ul>
