      <span class="badge">主要角色</span>
      <h1>阿嘉莎·哈克尼斯 (Agatha Harkness)</h1>
      <p>表面上是西景鎮中熱情、愛管閒事的鄰居「艾格尼絲（Agnes）」，實際上是一位擁有數百年歷史、經歷過 17 世紀薩勒姆女巫審判的強大古老女巫。</p>

      <h2>角色定位與陰謀</h2>
      <ul>
        <li><strong>窺探與誘導</strong>：她察覺到西景鎮異常龐大的魔法波動，因而潛入 Hex 結界內部，試圖探究汪達為何能不需透過咒語與學習就施展如此強大混沌魔法的秘密。</li>
        <li><strong>經典主題曲</strong>：以一首洗腦的宣傳曲《It Was Agatha All Along》揭露了自己才是幕後搞鬼、控制莫妮卡與製造鎮上混亂的主謀。</li>
      </ul>
